<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Dark Mode</title>
    <link rel="stylesheet" href="style/stylepage01.css">
</head>
<body>

    <main class="form-wrapper">
        <!-- BARRA SUPERIOR CON ICONOS -->

            <!-- Icono 1 (Sol) -->

            <!-- Icono 2 (Diamante/Escudo) -->
            <svg viewBox="0 0 24 24"><path d="M12.19 3.01c-.13-.01-.25-.01-.38 0-1.39.05-2.61.9-3.23 2.14l-4.14 8.27c-.49.98-.38 2.14.28 3.02.66.88 1.74 1.34 2.83 1.22l8.83-1.03c1.09-.13 2.03-.83 2.52-1.81l4.14-8.27c.49-.98.38-2.14-.28-3.02-.66-.88-1.74-1.34-2.83-1.22l-7.74.9z"/></svg>
            <!-- Icono 3 (Portapapeles) -->
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14H7v-2h3v2zm0-4H7v-2h3v2zm0-4H7V7h3v2zm7 8h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V7h4v2z"/></svg>
            <!-- Icono 4 (Código) -->
            <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
        </div>

        <!-- FORMULARIO -->
        <form>
            <input type="text" id="nombre" class="material-input" placeholder="Name">
            <input type="email" id="email" class="material-input" placeholder="E-mail">
            <input type="password" id="password" class="material-input" placeholder="Password">
            
            <!-- Campo de imagen del mismo ancho -->
            <div class="material-input file-input-wrapper">
                <span class="file-placeholder">Image</span>
                <input type="file" id="imagen" accept="image/*">
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="terminos">
                <label for="terminos">Do you agree?</label>
            </div>

            <div class="buttons-wrapper">
                <button type="submit">SUBMIT</button>
                <button type="reset">CLEAR</button>
            </div>
        </form>
    </main>

</body>
</html>
